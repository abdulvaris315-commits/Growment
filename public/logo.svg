<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Outer geometric ring -->
  <circle cx="128" cy="128" r="112" stroke="#141414" stroke-width="8" />
  
  <!-- Left vertical bar (shorter) -->
  <rect x="72" y="104" width="24" height="80" fill="#141414" />
  
  <!-- Right vertical bar (taller) -->
  <rect x="114" y="72" width="24" height="112" fill="#141414" />
  
  <!-- Golden sharp diagonal arrow surging up-right -->
  <line x1="80" y1="168" x2="168" y2="80" stroke="#B8801A" stroke-width="10" stroke-linecap="square" />
  
  <!-- Arrowhead polygon -->
  <polygon points="182,66 138,70 178,110" fill="#B8801A" />
</svg>
